<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>02 Editorial — Huaming</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#111; --muted:#3D5A73; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:var(--ink); font:16px/1.5 "IBM Plex Sans", sans-serif; }
    header { display:flex; justify-content:space-between; padding:20px 32px; }
    nav a { margin-left:20px; font-size:14px; color:inherit; text-decoration:none; }
    .hero { display:grid; grid-template-columns:1fr 1fr; min-height:86vh; }
    .copy { padding:8vh 48px 48px; }
    h1 { font-family:Newsreader, serif; font-size:clamp(44px,7vw,88px); line-height:.95; font-weight:600; margin:0 0 20px; }
    .photo { background:#111; color:#fff; display:flex; align-items:flex-end; padding:24px; font-size:13px; letter-spacing:.08em; }
    .btn { display:inline-block; margin-top:24px; border-bottom:1px solid #111; padding-bottom:4px; text-decoration:none; color:inherit; }
    @media (max-width:640px) { .hero { grid-template-columns:1fr; } .copy { padding:32px 20px; } }
  </style>
</head>
<body>
  <header>
    <strong>Huaming</strong>
    <nav>
      <a href="#">Products</a>
      <a href="#">Downloads</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>
  <section class="hero">
    <div class="copy">
      <h1>The switch inside the transformer</h1>
      <p>Huaming builds on-load and de-energized tap changers. Vacuum and conventional. Used in 150+ countries.</p>
      <a class="btn" href="#">See the range</a>
      &nbsp;&nbsp;
      <a class="btn" href="#">Talk to us</a>
    </div>
    <div class="photo">CV2 · VACUUM SELECTOR SWITCH · NO OVERLAY</div>
  </section>
</body>
</html>
