<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Header 04 · left lockup column</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #00428C;
      --steel: #0071A9;
      --ink: #262626;
      --canvas: #ffffff;
      --rule: #d1d1d1;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
    }
    .sketch-note {
      margin: 0;
      padding: 0.5rem 1.25rem;
      background: #eef1f4;
      font-size: 0.75rem;
    }
    header.grid {
      display: grid;
      grid-template-columns: 11.5rem minmax(0, 1fr);
      border-bottom: 1px solid var(--rule);
      background: var(--canvas);
    }
    .lockup {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.25rem;
      padding: 0.85rem 1.1rem;
      border-right: 1px solid var(--rule);
      text-decoration: none;
      color: var(--navy);
    }
    .lockup img {
      display: block;
      height: 1.65rem;
      width: auto;
    }
    .lockup .name {
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .lockup .sub {
      font-size: 0.625rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #3a3a3a;
    }
    .pane {
      display: flex;
      flex-direction: column;
      min-height: 4.5rem;
    }
    .util {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      padding: 0.4rem 1.25rem 0;
      font-size: 0.75rem;
    }
    .util a {
      color: #3a3a3a;
      text-decoration: none;
    }
    .util a:hover { color: var(--steel); }
    nav.primary {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0.35rem 1.25rem 0.7rem;
      flex: 1;
    }
    nav.primary a {
      color: var(--ink);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
    }
    nav.primary a:hover { color: var(--navy); }
    .dummy {
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1.5rem;
      color: #3a3a3a;
    }
  </style>
</head>
<body>
  <p class="sketch-note">04 · Left industrial lockup column. Header system sketch. Not for production.</p>
  <header class="grid">
    <a class="lockup" href="/" aria-label="Huaming home">
      <img src="logo.png" alt="" width="100" height="30" />
      <span class="name">Huaming</span>
      <span class="sub">Tap changers</span>
    </a>
    <div class="pane">
      <nav class="util" aria-label="Utility">
        <a href="/news/">News</a>
        <a href="/downloads/">Downloads</a>
        <a href="/contact/">Contact</a>
      </nav>
      <nav class="primary" aria-label="Primary">
        <a href="/products/">Products</a>
        <a href="/about/">About</a>
        <a href="/news/">News</a>
      </nav>
    </div>
  </header>
  <div class="dummy">
    <p>Voltage regulation for power transformers. Header chrome only.</p>
  </div>
</body>
</html>
