<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Header 01 · single compact bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #00428C;
      --steel: #0071A9;
      --ink: #262626;
      --canvas: #ffffff;
      --rule: #d1d1d1;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
    }
    .sketch-note {
      margin: 0;
      padding: 0.5rem 1.25rem;
      background: #eef1f4;
      font-size: 0.75rem;
      color: var(--ink);
    }
    header.bar {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      min-height: 3.5rem;
      padding: 0 1.5rem;
      border-bottom: 1px solid var(--rule);
      background: var(--canvas);
    }
    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--navy);
      flex: 0 0 auto;
    }
    .logo img {
      display: block;
      height: 1.85rem;
      width: auto;
    }
    nav.primary {
      display: flex;
      align-items: center;
      gap: 1.35rem;
      margin-left: 0.25rem;
    }
    nav.primary a {
      color: var(--ink);
      text-decoration: none;
      font-size: 0.9375rem;
      font-weight: 500;
    }
    nav.primary a:hover { color: var(--navy); }
    .spacer { flex: 1; }
    .util {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      font-size: 0.75rem;
    }
    .util a {
      color: #3a3a3a;
      text-decoration: none;
    }
    .util a:hover { color: var(--steel); }
    .util .split {
      width: 1px;
      height: 0.85rem;
      background: var(--rule);
    }
    .dummy {
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1.5rem;
      color: #3a3a3a;
    }
  </style>
</head>
<body>
  <p class="sketch-note">01 · Single compact bar. Header system sketch. Not for production.</p>
  <header class="bar">
    <a class="logo" href="/" aria-label="Huaming home">
      <img src="logo.png" alt="" width="120" height="36" />
    </a>
    <nav class="primary" aria-label="Primary">
      <a href="/products/">Products</a>
      <a href="/about/">About</a>
      <a href="/news/">News</a>
    </nav>
    <span class="spacer"></span>
    <nav class="util" aria-label="Utility">
      <a href="/news/">News</a>
      <a href="/downloads/">Downloads</a>
      <a href="/contact/">Contact</a>
      <span class="split" aria-hidden="true"></span>
      <a href="https://www.huaming.com" lang="zh">中文</a>
    </nav>
  </header>
  <div class="dummy">
    <p>Voltage regulation for power transformers. Header chrome only.</p>
  </div>
</body>
</html>
