<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Header 02 · navy solid bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #00428C;
      --steel: #0071A9;
      --ink: #262626;
      --canvas: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
    }
    .sketch-note {
      margin: 0;
      padding: 0.5rem 1.25rem;
      background: #eef1f4;
      font-size: 0.75rem;
    }
    header.navy {
      background: var(--navy);
      color: #fff;
      border-bottom: 3px solid var(--steel);
    }
    .inner {
      width: min(72rem, calc(100% - 2.5rem));
      margin: 0 auto;
      display: flex;
      align-items: center;
      min-height: 4rem;
      gap: 2rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: #fff;
    }
    .logo img {
      display: block;
      height: 1.75rem;
      width: auto;
      filter: brightness(0) invert(1);
    }
    .logo span {
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    nav.primary {
      display: flex;
      gap: 1.5rem;
    }
    nav.primary a {
      color: #fff;
      text-decoration: none;
      font-size: 0.9375rem;
      font-weight: 500;
    }
    nav.primary a:hover { color: #d6e8f4; }
    .spacer { flex: 1; }
    nav.util {
      display: flex;
      gap: 1.1rem;
      font-size: 0.75rem;
    }
    nav.util a {
      color: rgba(255, 255, 255, 0.82);
      text-decoration: none;
    }
    nav.util a:hover { color: #fff; }
    .dummy {
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1.5rem;
      color: #3a3a3a;
    }
  </style>
</head>
<body>
  <p class="sketch-note">02 · Navy solid bar, white type, steel hairline. Header system sketch. Not for production.</p>
  <header class="navy">
    <div class="inner">
      <a class="logo" href="/" aria-label="Huaming home">
        <img src="logo.png" alt="" width="120" height="36" />
        <span>Huaming</span>
      </a>
      <nav class="primary" aria-label="Primary">
        <a href="/products/">Products</a>
        <a href="/about/">About</a>
        <a href="/news/">News</a>
      </nav>
      <span class="spacer"></span>
      <nav class="util" aria-label="Utility">
        <a href="/news/">News</a>
        <a href="/downloads/">Downloads</a>
        <a href="/contact/">Contact</a>
      </nav>
    </div>
  </header>
  <div class="dummy">
    <p>Voltage regulation for power transformers. Header chrome only.</p>
  </div>
</body>
</html>
