<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Header 05 · ink bar, small-caps nav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #00428C;
      --steel: #0071A9;
      --ink: #262626;
      --canvas: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
    }
    .sketch-note {
      margin: 0;
      padding: 0.5rem 1.25rem;
      background: #eef1f4;
      font-size: 0.75rem;
    }
    header.ink {
      background: var(--ink);
      color: #fff;
    }
    .inner {
      width: min(72rem, calc(100% - 2.5rem));
      margin: 0 auto;
      display: flex;
      align-items: center;
      min-height: 3.25rem;
      gap: 1.75rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
      color: #fff;
    }
    .logo img {
      display: block;
      height: 1.4rem;
      width: auto;
      filter: brightness(0) invert(1);
    }
    .logo .mark-rule {
      width: 2px;
      height: 1.15rem;
      background: var(--steel);
    }
    nav.primary {
      display: flex;
      gap: 1.35rem;
    }
    nav.primary a {
      color: #fff;
      text-decoration: none;
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    nav.primary a:hover { color: #b8d4e8; }
    .spacer { flex: 1; }
    nav.util {
      display: flex;
      gap: 1rem;
    }
    nav.util a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 0.6875rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    nav.util a:hover { color: #fff; }
    .dummy {
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1.5rem;
      color: #3a3a3a;
    }
  </style>
</head>
<body>
  <p class="sketch-note">05 · Ink full-bleed bar, small-caps nav, small mark. Header system sketch. Not for production.</p>
  <header class="ink">
    <div class="inner">
      <a class="logo" href="/" aria-label="Huaming home">
        <img src="logo.png" alt="" width="90" height="28" />
        <span class="mark-rule" aria-hidden="true"></span>
      </a>
      <nav class="primary" aria-label="Primary">
        <a href="/products/">Products</a>
        <a href="/about/">About</a>
        <a href="/news/">News</a>
      </nav>
      <span class="spacer"></span>
      <nav class="util" aria-label="Utility">
        <a href="/news/">News</a>
        <a href="/downloads/">Downloads</a>
        <a href="/contact/">Contact</a>
      </nav>
    </div>
  </header>
  <div class="dummy">
    <p>Voltage regulation for power transformers. Header chrome only.</p>
  </div>
</body>
</html>
