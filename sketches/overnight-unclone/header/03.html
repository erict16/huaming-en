<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Header 03 · steel rail + text flyout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #00428C;
      --steel: #0071A9;
      --ink: #262626;
      --canvas: #ffffff;
      --rule: #d1d1d1;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
    }
    .sketch-note {
      margin: 0;
      padding: 0.5rem 1.25rem;
      background: #eef1f4;
      font-size: 0.75rem;
    }
    .rail {
      background: var(--steel);
      color: #fff;
      font-size: 0.75rem;
    }
    .rail .inner,
    .lower .inner {
      width: min(72rem, calc(100% - 2.5rem));
      margin: 0 auto;
      display: flex;
      align-items: center;
    }
    .rail .inner {
      justify-content: flex-end;
      gap: 1.15rem;
      min-height: 1.85rem;
    }
    .rail a {
      color: #fff;
      text-decoration: none;
    }
    .rail a:hover { text-decoration: underline; text-underline-offset: 0.15em; }
    .lower {
      background: var(--canvas);
      border-bottom: 1px solid var(--rule);
    }
    .lower .inner {
      min-height: 3.75rem;
      gap: 2rem;
    }
    .logo img {
      display: block;
      height: 2rem;
      width: auto;
    }
    nav.primary {
      display: flex;
      align-items: stretch;
      gap: 0.25rem;
    }
    nav.primary > a,
    .has-fly > a {
      display: flex;
      align-items: center;
      padding: 0 0.9rem;
      color: var(--ink);
      text-decoration: none;
      font-size: 0.9375rem;
      font-weight: 500;
    }
    nav.primary > a:hover,
    .has-fly:hover > a,
    .has-fly:focus-within > a {
      color: var(--navy);
    }
    .has-fly { position: relative; display: flex; }
    .fly {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 13rem;
      margin: 0;
      padding: 0.4rem 0;
      list-style: none;
      background: var(--canvas);
      border: 1px solid var(--rule);
      z-index: 20;
    }
    .has-fly:hover .fly,
    .has-fly:focus-within .fly { display: block; }
    .fly a {
      display: block;
      padding: 0.4rem 0.9rem;
      color: var(--ink);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 400;
    }
    .fly a:hover { background: #eef1f4; color: var(--navy); }
    .dummy {
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1.5rem;
      color: #3a3a3a;
    }
  </style>
</head>
<body>
  <p class="sketch-note">03 · Steel top rail + white lower nav, text flyout. Header system sketch. Not for production.</p>
  <header>
    <div class="rail">
      <div class="inner">
        <a href="/news/">News</a>
        <a href="/downloads/">Downloads</a>
        <a href="/contact/">Contact</a>
      </div>
    </div>
    <div class="lower">
      <div class="inner">
        <a class="logo" href="/" aria-label="Huaming home">
          <img src="logo.png" alt="" width="120" height="36" />
        </a>
        <nav class="primary" aria-label="Primary">
          <div class="has-fly">
            <a href="/products/">Products</a>
            <ul class="fly">
              <li><a href="/products/oltc/">On-load</a></li>
              <li><a href="/products/octc/">De-energized</a></li>
              <li><a href="/products/accessories/">Motor drives</a></li>
            </ul>
          </div>
          <a href="/about/">About</a>
          <a href="/news/">News</a>
        </nav>
      </div>
    </div>
  </header>
  <div class="dummy">
    <p>Voltage regulation for power transformers. Hover Products for a text flyout. Header chrome only.</p>
  </div>
</body>
</html>
